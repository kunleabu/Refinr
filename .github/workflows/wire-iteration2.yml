name: Wire Iteration 2 research journey
on:
  push:
    branches: [feature/iteration-2-research-workspace]
    paths: [.github/workflows/wire-iteration2.yml]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/iteration-2-research-workspace
      - name: Patch homepage journey
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="""function exploreResearch(e){
              e.preventDefault();
              var input=document.getElementById('researchQuestion'),question=input.value.trim();
              if(!question){input.setCustomValidity('Enter a research question to begin.');input.reportValidity();return;}
              input.setCustomValidity('');
              pendingIntent={route:'idea',question:question};
              if(!currentUser){openAuthModal('signin');return;}
              resumeResearchIntent();
          }"""
          new="""function exploreResearch(e){
              e.preventDefault();
              var input=document.getElementById('researchQuestion'),question=input.value.trim();
              if(!question){input.setCustomValidity('Enter a research question to begin.');input.reportValidity();return;}
              input.setCustomValidity('');
              localStorage.setItem('refinr-research-question',question);
              location.href='/research.html?q='+encodeURIComponent(question);
          }"""
          assert old in s, 'exploreResearch contract changed'
          s=s.replace(old,new,1)
          old_note='<p class="question-note">Find academic papers. Follow the original sources.<br>Search uses 2 credits · <span id="questionAuthNote">Sign in before searching.</span></p>'
          new_note='<p class="question-note">Find academic papers. Follow the original sources.<br><span id="questionAuthNote">Preview 5 real papers free. Sign up only when you want to continue.</span></p>'
          assert old_note in s, 'front-door note changed'
          s=s.replace(old_note,new_note,1)
          marker="""function resumeResearchIntent(){
              if(!pendingIntent||!currentUser)return;
              var intent=pendingIntent;pendingIntent=null;
              if(intent.route==='idea')openIdeaModal(intent.question);
              else if(intent.route==='pdf')openUploadModal();
          }
          """
          addition="""function resumeSavedResearchIntent(){
              if(!currentUser)return false;
              var target=localStorage.getItem('refinr-research-return');
              if(!target)return false;
              localStorage.removeItem('refinr-research-return');
              location.href=target;
              return true;
          }
          function handleEntryIntent(){
              var entry=new URLSearchParams(location.search),intent=entry.get('intent'),auth=entry.get('auth');
              if(intent==='references'){
                  try{
                      var papers=JSON.parse(localStorage.getItem('refinr-selected-research-references')||'[]');
                      var refs=papers.map(function(p){return p&&p.formatted||'';}).filter(Boolean);
                      if(refs.length){
                          var box=document.getElementById('referencesInput'),existing=box.value.trim();
                          box.value=existing?existing+'\\n'+refs.join('\\n'):refs.join('\\n');
                          localStorage.removeItem('refinr-selected-research-references');
                          showOutput('Research — References loaded',refs.join('\\n\\n')+'\\n\\n─────────────────────────────\\n💡 '+refs.length+' reference(s) loaded. Click “Clean references” to format them.');
                          document.getElementById('referenceWorkspace').scrollIntoView({behavior:preferredScrollBehavior(),block:'start'});
                      }
                  }catch(e){}
              }
              if(intent==='research'&&auth==='signup'&&!currentUser){
                  var context=document.getElementById('authContext');
                  if(context){context.hidden=false;context.textContent='Create your free account to continue the research you already started.';}
                  openAuthModal('signup');
              }else if(intent==='research'&&currentUser){resumeSavedResearchIntent();}
          }
          """
          assert marker in s, 'resumeResearchIntent marker changed'
          s=s.replace(marker,marker+addition,1)
          load_marker="loadSharedReport();detectUserCurrency();loadCslIndex();"
          assert load_marker in s, 'load marker changed'
          s=s.replace(load_marker,load_marker+'handleEntryIntent();',1)
          ui_old="""    document.getElementById('avatarName').textContent=user.full_name||user.email.split('@')[0];
              updateCreditsDisplay(user.credits);
          }"""
          ui_new="""    document.getElementById('avatarName').textContent=user.full_name||user.email.split('@')[0];
              updateCreditsDisplay(user.credits);
              if(new URLSearchParams(location.search).get('intent')==='research')resumeSavedResearchIntent();
          }"""
          assert ui_old in s, 'logged-in UI marker changed'
          s=s.replace(ui_old,ui_new,1)
          p.write_text(s)
          PY
      - name: Sanity-check wiring
        run: |
          grep -F "location.href='/research.html?q='" index.html
          grep -F "refinr-selected-research-references" index.html
          grep -F "Create your free account to continue the research you already started." index.html
      - name: Commit generated wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect homepage to research workspace and references"
          git push origin HEAD:feature/iteration-2-research-workspace
