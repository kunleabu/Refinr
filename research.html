<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research workspace — Refinr</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');
:root{--bg:#f4f7fb;--bg2:#eaf1f8;--card:rgba(255,255,255,.78);--solid:#fff;--text:#142033;--muted:#5d6b7d;--border:rgba(30,55,85,.12);--primary:#147d8c;--green:#15966d;--warn:#a65f0b;--danger:#c23b3b;--shadow:0 18px 55px rgba(20,43,70,.1)}
[data-theme="dark"]{--bg:#07111f;--bg2:#0b1b2d;--card:rgba(15,29,47,.78);--solid:#102238;--text:#e9f2fb;--muted:#adc0d3;--border:rgba(180,215,240,.13);--primary:#42c4cf;--green:#4bd19f;--warn:#f0a44d;--danger:#ff8585;--shadow:0 22px 70px rgba(0,0,0,.28)}
*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;color:var(--text);background:radial-gradient(circle at 12% 8%,rgba(57,184,196,.13),transparent 28%),radial-gradient(circle at 88% 18%,rgba(118,87,216,.1),transparent 26%),linear-gradient(135deg,var(--bg),var(--bg2));min-height:100vh}.shell{max-width:1040px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{font:800 1.15rem 'Manrope';letter-spacing:3px}.brand b{color:var(--primary)}button,input,select{font:inherit}.ghost,.primary{border-radius:12px;padding:11px 15px;cursor:pointer;font-weight:700}.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}.primary{background:linear-gradient(135deg,#0d6474,#19a0ad);color:#fff;border:0}.primary:disabled{opacity:.55;cursor:wait}.journey{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.78rem;font-weight:700;letter-spacing:.08em;margin:0 0 18px}.journey .active{color:var(--primary)}.journey i{height:1px;background:var(--border);flex:1}.card{background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(20px);padding:28px;margin-bottom:18px}.eyebrow{color:var(--primary);font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em}h1,h2{font-family:'Manrope';margin:8px 0 10px}h1{font-size:clamp(1.55rem,4vw,2.3rem)}h2{font-size:1.15rem}p{color:var(--muted);line-height:1.6}.question{padding:16px;border:1px solid var(--border);background:rgba(20,125,140,.06);border-radius:15px;font-weight:600;line-height:1.55;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:.78rem;font-weight:700;margin:0 0 7px}.field input,.field select{width:100%;border:1px solid var(--border);background:var(--solid);color:var(--text);border-radius:12px;padding:12px}.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:18px}.status{padding:12px 14px;border-radius:13px;background:rgba(21,150,109,.08);color:var(--green);font-size:.82rem;font-weight:700;margin:12px 0}.status.partial{background:rgba(210,123,29,.09);color:var(--warn)}.results{display:grid;gap:11px}.paper{border:1px solid var(--border);background:var(--solid);border-radius:16px;padding:16px}.paper-head{display:flex;gap:11px;align-items:flex-start}.paper input{margin-top:4px}.paper-title{font-weight:800;line-height:1.4}.meta,.abstract{font-size:.78rem;color:var(--muted);line-height:1.55;margin-top:6px}.paper a{color:var(--primary)}.continue{border-top:1px solid var(--border);margin-top:18px;padding-top:18px}.continue strong{display:block;font:800 1rem 'Manrope';margin-bottom:5px}.hidden{display:none!important}.error{color:var(--danger);font-size:.82rem;margin-top:10px}.count{font-weight:800;color:var(--text)}.credit-note{font-size:.75rem;color:var(--muted);margin:8px 0 0;text-align:right}@media(max-width:680px){.shell{padding:16px}.card{padding:20px}.grid{grid-template-columns:1fr}.actions{align-items:stretch;flex-direction:column-reverse}.actions button{width:100%}.journey{font-size:.68rem}.credit-note{text-align:left}}
</style>
</head>
<body>
<main class="shell">
<div class="top"><div class="brand"><b>R</b> REFINR</div><button class="ghost" id="themeBtn" type="button">Dark</button></div>
<div class="journey" aria-label="Research journey"><span class="active">DISCOVER</span><i></i><span id="understandStep">UNDERSTAND</span><i></i><span>REFERENCE</span></div>
<section class="card" id="configure">
<div class="eyebrow">Explore your research</div><h1>Shape the search, not the question again.</h1><p>Refinr keeps the question you already asked. Add only the boundaries that make the evidence more useful.</p>
<div class="question" id="questionDisplay"></div>
<div class="grid">
<div class="field"><label for="yearFrom">From year</label><input id="yearFrom" inputmode="numeric" placeholder="e.g. 2015"></div>
<div class="field"><label for="yearTo">To year</label><input id="yearTo" inputmode="numeric" placeholder="e.g. 2026"></div>
<div class="field" style="grid-column:1/-1"><label for="mustInclude">Add search terms <span style="font-weight:400;color:var(--muted)">(optional)</span></label><input id="mustInclude" placeholder="e.g. access to finance"></div>
<div class="field" style="grid-column:1/-1"><label for="style">Citation style</label><select id="style"><option>Harvard</option><option>APA</option><option>MLA</option><option>Chicago</option><option>Vancouver</option><option>IEEE</option></select></div>
</div>
<div id="configError" class="error" role="alert"></div><div class="actions"><button class="ghost" type="button" onclick="history.back()">Back</button><button class="primary" id="findBtn" type="button">Find research</button></div><p class="credit-note" id="creditNote"></p>
</section>
<section class="card hidden" id="evidence">
<div class="eyebrow">Evidence found</div><h2 id="resultHeading">Research results</h2><div id="sourceStatus"></div><p id="resultMeta"></p><div class="results" id="results"></div>
<div class="continue hidden" id="anonymousContinue"><strong>Your research is ready.</strong><p id="continueCopy"></p><button class="primary" type="button" id="saveResearchBtn">Save my research — free</button></div>
<div class="actions"><button class="ghost" type="button" id="refineBtn">Refine search</button><button class="primary hidden" type="button" id="referenceBtn">Continue to references</button></div>
</section>
</main>
<script>
var params=new URLSearchParams(location.search),stored=localStorage.getItem('refinr-research-question');
var question=(params.get('q')||stored||'').trim();
var currentUser=null,currentSession=null,ideaPapers=[],researchSession=null,sessionMode=false;
try{currentUser=JSON.parse(localStorage.getItem('refinr-user')||'null');currentSession=JSON.parse(localStorage.getItem('refinr-session')||'null');researchSession=JSON.parse(localStorage.getItem('refinr-active-research-session')||'null');}catch(e){}
if(!question){location.replace('/');}else{localStorage.setItem('refinr-research-question',question);document.getElementById('questionDisplay').textContent=question;}
var savedTheme=localStorage.getItem('refinr-theme')||'light';document.documentElement.dataset.theme=savedTheme;syncTheme();
document.getElementById('themeBtn').onclick=function(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';localStorage.setItem('refinr-theme',document.documentElement.dataset.theme);syncTheme();};
function syncTheme(){document.getElementById('themeBtn').textContent=document.documentElement.dataset.theme==='dark'?'Light':'Dark';}
function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function uuid(){return crypto.randomUUID();}
function effectiveQuery(){var include=document.getElementById('mustInclude').value.trim(),q=question;if(include)q+=' '+include;return q;}
function sourceLabel(name){return name==='openalex'?'OpenAlex':name==='crossref'?'Crossref':name;}
function renderSourceStatus(data){var statuses=data.sourceStatus||(data.pull&&data.pull.sourceStatus)||{},names=Object.keys(statuses),partial=names.some(function(name){var s=statuses[name];return (typeof s==='string'?s:s&&s.status)!=='ok';}),bits=names.map(function(name){var s=statuses[name],ok=(typeof s==='string'?s:s&&s.status)==='ok';return sourceLabel(name)+' '+(ok?'✓':'temporarily unavailable');});var el=document.getElementById('sourceStatus');if(!bits.length){el.className='hidden';return;}el.className='status'+(partial?' partial':'');el.textContent=bits.join(' · ')+(partial?' · Results may be incomplete.':'');}
function renderPapers(papers){var list=document.getElementById('results');list.innerHTML='';papers.forEach(function(p){var card=document.createElement('article');card.className='paper';var authors=(p.authors||[]).slice(0,3).join(', ')+((p.authors||[]).length>3?' et al.':'');card.innerHTML='<div class="paper-head"><input type="checkbox" checked aria-label="Select '+esc(p.title)+'"><div><div class="paper-title">'+esc(p.title)+'</div><div class="meta">'+esc(authors)+' · '+esc(p.year||'n.d.')+(p.journal?' · '+esc(p.journal):'')+(p.doiUrl?' · <a href="'+esc(p.doiUrl)+'" target="_blank" rel="noopener">View paper ↗</a>':'')+'</div>'+(p.abstract?'<div class="abstract">'+esc(p.abstract.slice(0,260))+(p.abstract.length>260?'…':'')+'</div>':'')+'</div></div>';card.dataset.paperId=p.id;list.appendChild(card);});}
async function refreshSession(){if(!currentSession||!currentSession.refresh_token)return false;try{var r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'refresh',refresh_token:currentSession.refresh_token})}),d=await r.json();if(!d.session)return false;currentSession=d.session;localStorage.setItem('refinr-session',JSON.stringify(d.session));return true;}catch(e){return false;}}
async function authenticatedPost(body){if(!currentSession||!currentSession.access_token)throw Error('Your session has expired. Please sign in again.');async function request(){var r=await fetch('/api/searchbyidea',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+currentSession.access_token},body:JSON.stringify(body)}),d=await r.json();return {r:r,d:d};}var result=await request();if(result.r.status===401&&await refreshSession())result=await request();return result;}
async function researchAction(body){var result=await authenticatedPost(body);if(!result.r.ok){var err=Error(result.d.error||'Research operation failed.');err.code=result.d.error;err.status=result.r.status;throw err;}return result.d;}
async function deductSearchCredits(){if(!currentUser)return true;if(!currentSession||!currentSession.access_token)throw Error('Your session has expired. Please sign in again.');async function request(){var r=await fetch('/api/credits',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+currentSession.access_token},body:JSON.stringify({action:'deduct',amount:2,description:'Search by idea: '+question.substring(0,50)})}),d=await r.json();return {r:r,d:d};}var result=await request();if(result.r.status===401&&await refreshSession())result=await request();if(!result.r.ok)throw Error(result.d.error||'Could not use search credits.');if(typeof result.d.credits==='number'){currentUser.credits=result.d.credits;localStorage.setItem('refinr-user',JSON.stringify(currentUser));}return true;}
function sessionContext(){return {topic:effectiveQuery(),yearFrom:document.getElementById('yearFrom').value.trim()||null,yearTo:document.getElementById('yearTo').value.trim()||null,population:null,location:null,selectedAngle:null,exclusions:[],extraConstraints:{}};}
async function createAndAcquireSession(){var created=await researchAction({action:'session.create',requestId:uuid(),idea:question,context:sessionContext(),format:document.getElementById('style').value});researchSession=created.session;localStorage.setItem('refinr-active-research-session',JSON.stringify(researchSession));/* Preview sessions are unbilled while persistence is under test. */var data=await researchAction({action:'pull.acquire',sessionId:researchSession.id,requestId:uuid(),expectedVersion:researchSession.row_version,contextRevision:researchSession.context_revision,pullKind:'initial',limit:10});sessionMode=true;return data;}
async function legacySearch(){await deductSearchCredits();var body={idea:effectiveQuery(),format:document.getElementById('style').value,yearFrom:document.getElementById('yearFrom').value.trim()||null,yearTo:document.getElementById('yearTo').value.trim()||null,preview:false};var r=await fetch('/api/searchbyidea',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),data=await r.json();if(!r.ok)throw Error(data.error||'Search failed.');sessionMode=false;return data;}
async function signedInSearch(){try{return await createAndAcquireSession();}catch(e){if(e.code!=='RESEARCH_SESSIONS_DISABLED')throw e;researchSession=null;localStorage.removeItem('refinr-active-research-session');return legacySearch();}}
async function anonymousSearch(){var body={idea:effectiveQuery(),format:document.getElementById('style').value,yearFrom:document.getElementById('yearFrom').value.trim()||null,yearTo:document.getElementById('yearTo').value.trim()||null,preview:true};var r=await fetch('/api/searchbyidea',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),data=await r.json();if(!r.ok)throw Error(data.error||'Search failed.');return data;}
async function findResearch(){var btn=document.getElementById('findBtn'),error=document.getElementById('configError'),from=document.getElementById('yearFrom').value.trim(),to=document.getElementById('yearTo').value.trim();error.textContent='';if(from&&to&&Number(from)>Number(to)){error.textContent='The start year cannot be later than the end year.';return;}btn.disabled=true;btn.textContent='Finding evidence…';try{var data=currentUser?await signedInSearch():await anonymousSearch();ideaPapers=data.papers||[];renderPapers(ideaPapers);renderSourceStatus(data);document.getElementById('configure').classList.add('hidden');document.getElementById('evidence').classList.remove('hidden');document.getElementById('understandStep').classList.add('active');var shown=ideaPapers.length,acquired=Number.isFinite(data.acquiredCount)?data.acquiredCount:(data.pull&&Array.isArray(data.pull.acquiredPaperIds)?data.pull.acquiredPaperIds.length:shown);document.getElementById('resultHeading').textContent=shown?'Strong starting points':'No papers found';document.getElementById('resultMeta').innerHTML='<span class="count">'+shown+'</span> shown from <span class="count">'+acquired+'</span> papers acquired in this search.';document.getElementById('anonymousContinue').classList.toggle('hidden',!!currentUser||!shown);document.getElementById('referenceBtn').classList.toggle('hidden',!currentUser||!shown);if(!currentUser&&shown)document.getElementById('continueCopy').textContent='You are viewing the first '+shown+' real papers. Create a free account to continue your research and use Refinr’s saved-work features as they become available.';window.scrollTo({top:0,behavior:'smooth'});}catch(e){error.textContent=e.message;}finally{btn.disabled=false;btn.textContent='Find research';}}
document.getElementById('creditNote').textContent=currentUser?'Preview research sessions are currently unbilled while testing.':'Anonymous preview: first 5 real papers, no credits required.';
document.getElementById('findBtn').onclick=findResearch;
document.getElementById('refineBtn').onclick=function(){document.getElementById('evidence').classList.add('hidden');document.getElementById('configure').classList.remove('hidden');document.getElementById('understandStep').classList.remove('active');window.scrollTo({top:0,behavior:'smooth'});};
document.getElementById('saveResearchBtn').onclick=function(){localStorage.setItem('refinr-pending-research',JSON.stringify({question:question,query:effectiveQuery(),yearFrom:document.getElementById('yearFrom').value||null,yearTo:document.getElementById('yearTo').value||null,format:document.getElementById('style').value,papers:ideaPapers}));localStorage.setItem('refinr-research-return','/research.html?q='+encodeURIComponent(question));location.href='/?auth=signup&intent=research';};
document.getElementById('referenceBtn').onclick=function(){var selected=Array.from(document.querySelectorAll('.paper')).filter(function(card){return card.querySelector('input').checked;}).map(function(card){return ideaPapers.find(function(p){return p.id===card.dataset.paperId;});}).filter(Boolean);localStorage.setItem('refinr-selected-research-references',JSON.stringify(selected));location.href='/?intent=references';};
</script>
</body></html>
